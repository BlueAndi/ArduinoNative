name: Test

# Controls when the action will run.
on: [push, workflow_dispatch]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # The introduction just shows some useful informations.
  intro:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
      - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "The name of the branch is ${{ github.ref }} and the repository is ${{ github.repository }}."

  test:
    # The type of runner that the job will run on. The native environment
    # has host specific code, therefore it is tested on Linux and Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Intro must run first
    needs: intro
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .github/workflows/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/workflows/requirements.txt

      - name: Perform static checks on native environment
        # clang-tidy is not usable with the Windows toolchain.
        if: runner.os == 'Linux'
        run: platformio check --environment native --fail-on-defect=medium --fail-on-defect=high

      - name: Run tests on native environment
        run: platformio test --environment native -vvv